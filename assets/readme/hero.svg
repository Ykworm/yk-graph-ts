<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="400" viewBox="0 0 1200 400"
     role="img" aria-labelledby="title desc">
  <title id="title">yk-graph-ts — the knowledge-graph storage layer for yk-lens</title>
  <desc id="desc">Graph service built with the official Ladybug TypeScript SDK. Left: project name and value. Right: the real data model with Doc, Concept and Theme nodes connected by INCLUDES, MENTIONS and REL edges.</desc>

  <rect width="1200" height="400" rx="26" fill="#050607"/>

  <!-- left: identity -->
  <g transform="translate(56 0)">
    <text x="0" y="86" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="14" letter-spacing="3" fill="#8A8F98">GRAPH SERVICE · FOR YK-LENS</text>

    <text x="0" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="80" font-weight="700" fill="#F2F1EC">yk-graph-ts</text>

    <text x="0" y="228" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
          font-size="21" fill="#A8ADB5">yk-lens 的知识图谱存储层</text>
    <text x="0" y="258" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
          font-size="21" fill="#A8ADB5">TypeScript + Ladybug 官方 SDK · HTTP :8702</text>

    <text x="0" y="312" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="15" fill="#6B7078">parameterized Cypher · single-writer · Node ≥ 20</text>
  </g>

  <!-- right: the real graph model -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">

    <!-- edges -->
    <path d="M 950 88 L 800 140" stroke="#3A3F47" stroke-width="1.5"/>
    <text x="872" y="102" font-size="16" font-weight="600" fill="#E4572E" text-anchor="middle">INCLUDES</text>

    <path d="M 800 168 L 950 250" stroke="#3A3F47" stroke-width="1.5"/>
    <text x="952" y="216" font-size="16" font-weight="600" fill="#E4572E" text-anchor="middle">MENTIONS</text>

    <path d="M 950 278 L 800 320" stroke="#3A3F47" stroke-width="1.5"/>
    <text x="870" y="306" font-size="16" font-weight="600" fill="#E4572E" text-anchor="middle">REL</text>

    <!-- Theme -->
    <g transform="translate(950 60)">
      <rect width="200" height="56" rx="12" fill="#0E1116" stroke="#2A2D33" stroke-width="1.5"/>
      <circle cx="16" cy="16" r="5" fill="#E4572E"/>
      <text x="32" y="36" font-size="16" font-weight="700" fill="#F2F1EC">Theme</text>
    </g>

    <!-- Doc -->
    <g transform="translate(700 140)">
      <rect width="200" height="56" rx="12" fill="#0E1116" stroke="#2A2D33" stroke-width="1.5"/>
      <circle cx="16" cy="16" r="5" fill="#E4572E"/>
      <text x="32" y="36" font-size="16" font-weight="700" fill="#F2F1EC">Doc</text>
    </g>

    <!-- Concept -->
    <g transform="translate(950 250)">
      <rect width="200" height="56" rx="12" fill="#0E1116" stroke="#2A2D33" stroke-width="1.5"/>
      <circle cx="16" cy="16" r="5" fill="#E4572E"/>
      <text x="32" y="36" font-size="16" font-weight="700" fill="#F2F1EC">Concept</text>
    </g>

    <!-- Concept -->
    <g transform="translate(700 320)">
      <rect width="200" height="56" rx="12" fill="#0E1116" stroke="#2A2D33" stroke-width="1.5"/>
      <circle cx="16" cy="16" r="5" fill="#E4572E"/>
      <text x="32" y="36" font-size="16" font-weight="700" fill="#F2F1EC">Concept</text>
    </g>
  </g>
</svg>
